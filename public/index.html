<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Laravel Log Email Inspector</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#fff; --fg:#1f2328; --muted:#656d76; --line:#d8dee4; --sel:#ddeaff; --hover:#f3f6fa; --accent:#0b57d0; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b1d21; --fg:#e6e8eb; --muted:#9aa2ab; --line:#33373d; --sel:#1f3556; --hover:#24272c; --accent:#8ab4f8; } }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column; font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; gap:12px; align-items:center; padding:8px 14px; border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; margin:0; }
  header input { flex:1; max-width:380px; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  header .meta { color:var(--muted); font-size:12px; margin-left:auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  main { flex:1; display:flex; min-height:0; }
  #list { width:420px; min-width:280px; overflow-y:auto; border-right:1px solid var(--line); resize:horizontal; }
  .row { padding:10px 14px; border-bottom:1px solid var(--line); cursor:pointer; }
  .row:hover { background:var(--hover); } .row.sel { background:var(--sel); }
  .row .top { display:flex; justify-content:space-between; gap:8px; }
  .row .from { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .date { color:var(--muted); font-size:12px; white-space:nowrap; }
  .row .subject { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .preview { color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .to { color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #detail { flex:1; display:flex; flex-direction:column; min-width:0; }
  #head { padding:14px 18px; border-bottom:1px solid var(--line); }
  #head h2 { margin:0 0 8px; font-size:20px; font-weight:500; }
  #head dl { display:grid; grid-template-columns:auto 1fr; gap:2px 12px; margin:0; }
  #head dt { color:var(--muted); } #head dd { margin:0; word-break:break-all; }
  .chip { display:inline-block; padding:1px 8px; margin:0 4px 0 0; border:1px solid var(--line); border-radius:10px; font-size:12px; }
  .tabs { display:flex; gap:4px; padding:6px 18px 0; border-bottom:1px solid var(--line); }
  .tabs button { background:none; border:0; border-bottom:2px solid transparent; padding:6px 10px; color:var(--muted); cursor:pointer; font:inherit; }
  .tabs button.on { color:var(--accent); border-color:var(--accent); }
  #body { flex:1; min-height:0; overflow:auto; }
  iframe { width:100%; height:100%; border:0; background:#fff; }
  pre { margin:0; padding:16px 18px; white-space:pre-wrap; word-break:break-word; font:12.5px/1.5 ui-monospace,Menlo,monospace; }
  .empty { padding:40px; color:var(--muted); text-align:center; }
</style>
</head>
<body>
<header>
  <h1>📬 Laravel Log Email Inspector</h1>
  <input id="q" type="search" placeholder="Search subject, sender, recipient, body…">
  <span class="meta" id="meta"></span>
</header>
<main>
  <div id="list"></div>
  <section id="detail"><div class="empty">Select an email</div></section>
</main>
<script>
const $ = (s) => document.querySelector(s)
let emails = [], selected = null, tab = 'html', lastSig = ''
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const who = (a) => a.name ? `${a.name} <${a.address}>` : a.address
const short = (list) => list.map((a) => a.name || a.address).join(', ')

function fmtDate(iso) {
  const d = new Date(iso.length === 19 ? iso.replace(' ', 'T') : iso)
  const now = new Date()
  return d.toDateString() === now.toDateString()
    ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    : d.toLocaleDateString([], { day: 'numeric', month: 'short', year: d.getFullYear() === now.getFullYear() ? undefined : 'numeric' }) + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
}

function matches(e, q) {
  if (!q) return true
  return [e.subject, e.preview, ...e.from.map(who), ...e.to.map(who)].join(' ').toLowerCase().includes(q.toLowerCase())
}

function renderList() {
  const rows = emails.filter((e) => matches(e, $('#q').value))
  $('#list').innerHTML = rows.length ? rows.map((e) => `
    <div class="row ${e.id === selected ? 'sel' : ''}" data-id="${e.id}">
      <div class="top"><span class="from">${esc(short(e.from))}</span><span class="date">${esc(fmtDate(e.date ?? e.loggedAt))}</span></div>
      <div class="subject">${esc(e.subject)}${e.attachments.length ? ' 📎' : ''}</div>
      <div class="preview">${esc(e.preview)}</div>
      <div class="to">to ${esc(short(e.to))}</div>
    </div>`).join('') : '<div class="empty">No emails found in the log</div>'
}

async function select(id) {
  selected = id
  renderList()
  const e = await (await fetch(`/api/emails/${id}`)).json()
  const row = (k, v) => v ? `<dt>${k}</dt><dd>${v}</dd>` : ''
  const chips = (l) => l.map((a) => `<span class="chip">${esc(who(a))}</span>`).join('')
  $('#detail').innerHTML = `
    <div id="head">
      <h2>${esc(e.subject)}</h2>
      <dl>
        ${row('From', chips(e.from))}${row('To', chips(e.to))}${row('Cc', chips(e.cc))}${row('Bcc', chips(e.bcc))}${row('Reply-To', chips(e.replyTo))}
        ${row('Date', esc(e.date ? new Date(e.date).toLocaleString() : ''))}
        ${row('Logged', esc(e.loggedAt))}
        ${row('Message-ID', esc(e.messageId))}
        ${row('Attachments', e.attachments.map((a) => `<span class="chip">${esc(a.filename ?? 'unnamed')} · ${esc(a.contentType)} · ${a.size} B</span>`).join(''))}
      </dl>
    </div>
    <div class="tabs">${['html', 'text', 'headers', 'source'].map((t) => `<button data-tab="${t}">${t === 'html' ? 'HTML' : t[0].toUpperCase() + t.slice(1)}</button>`).join('')}</div>
    <div id="body"></div>`
  const show = (t) => {
    tab = t
    document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === t))
    const body = $('#body')
    if (t === 'html' && e.html) {
      body.innerHTML = '<iframe sandbox></iframe>'
      body.firstChild.srcdoc = e.html
    } else if (t === 'html') {
      body.innerHTML = '<div class="empty">This email has no HTML part</div>'
    } else {
      body.innerHTML = `<pre>${esc(t === 'text' ? e.text : t === 'headers' ? e.headers.join('\n') : e.source)}</pre>`
    }
  }
  document.querySelectorAll('.tabs button').forEach((b) => (b.onclick = () => show(b.dataset.tab)))
  show(tab === 'html' && !e.html ? 'text' : tab)
}

async function load() {
  const data = await (await fetch('/api/emails')).json()
  const sig = data.emails.map((e) => e.id + e.messageId).join()
  $('#meta').textContent = `${data.emails.length} emails · ${data.logPath}`
  if (sig === lastSig) return
  lastSig = sig
  emails = data.emails
  if (selected === null && emails.length) return select(emails[0].id)
  renderList()
}

$('#list').onclick = (ev) => { const r = ev.target.closest('.row'); if (r) select(Number(r.dataset.id)) }
$('#q').oninput = renderList
load()
setInterval(load, 3000)
</script>
</body>
</html>
